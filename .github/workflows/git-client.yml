name: Git Client

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version for this immutable release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: git-client-manual-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify configured Node.js
        run: test "v$(cat .node-version)" = "$(node --version)"
      - run: pnpm install --frozen-lockfile
      - name: Validate shadcn workspace manifest
        run: pnpm --filter @jongminchung/git-client exec shadcn info --json
      - run: pnpm run audit:prod
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e 'if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_VERSION ?? "")) process.exit(1)'
      - run: pnpm exec oxfmt --config oxfmt.config.ts --check apps/git-client
      - run: pnpm exec oxlint --config oxlint.config.ts apps/git-client
      - run: pnpm --filter @jongminchung/git-client run typecheck
      - run: pnpm --filter @jongminchung/git-client run test
      - run: pnpm --filter @jongminchung/git-client run build
      - name: Report Git Client renderer asset changes
        run: pnpm --filter @jongminchung/git-client run bundle:report -- --output=apps/git-client/bundle-report.json
      - run: pnpm --filter @jongminchung/git-client exec playwright install chromium
      - run: pnpm --filter @jongminchung/git-client run test:e2e
      - name: Build and validate local ad-hoc Electron ARM64 artifacts
        run: pnpm --filter @jongminchung/git-client run release:validate-local -- "${{ inputs.version }}"
      - name: Upload compact QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-client-compact-qa
          path: |
            apps/git-client/test-results/qa/*.json
            apps/git-client/test-results/**/trace.zip
            apps/git-client/test-results/**/*-diff.png
            apps/git-client/bundle-report.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: git-client-macos-arm64-adhoc-${{ inputs.version }}
          path: |
            apps/git-client/out/Git Client-darwin-arm64/Git Client.app
            apps/git-client/release-artifacts/Git-Client_${{ inputs.version }}_macos_arm64_adhoc.dmg
            apps/git-client/release-artifacts/Git-Client_${{ inputs.version }}_macos_arm64_adhoc.dmg.sha256

  release:
    needs: verify
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify configured Node.js
        run: test "v$(cat .node-version)" = "$(node --version)"
      - run: pnpm install --frozen-lockfile
      - name: Configure Developer ID signing and Apple notarization
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.GIT_CLIENT_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.GIT_CLIENT_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.GIT_CLIENT_APPLE_TEAM_ID }}
          CERTIFICATE_BASE64: ${{ secrets.GIT_CLIENT_CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.GIT_CLIENT_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"

          signing_keychain="${RUNNER_TEMP}/git-client-signing.keychain-db"
          signing_certificate="${RUNNER_TEMP}/git-client-signing.p12"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$signing_certificate"
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$signing_certificate" \
            -k "$signing_keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain"
          xcrun notarytool store-credentials git-client-ci \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$signing_keychain"
          rm "$signing_certificate"
      - name: Publish immutable Git Client release
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_CLIENT_CODESIGN_IDENTITY: ${{ secrets.GIT_CLIENT_CODESIGN_IDENTITY }}
          GIT_CLIENT_NOTARY_KEYCHAIN: ${{ runner.temp }}/git-client-signing.keychain-db
          GIT_CLIENT_NOTARY_KEYCHAIN_PROFILE: git-client-ci
        run: pnpm --filter @jongminchung/git-client run release -- "${{ inputs.version }}"
      - name: Remove ephemeral signing keychain
        if: always()
        run: security delete-keychain "${RUNNER_TEMP}/git-client-signing.keychain-db" || true
