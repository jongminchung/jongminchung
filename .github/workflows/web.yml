name: Web

on:
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/tooling/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/tooling/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jongminchung/web run typecheck
      - run: pnpm --filter @jongminchung/web run test
      - run: pnpm --filter @jongminchung/web run build
      - run: pnpm --filter @jongminchung/web exec playwright install --with-deps chromium
      - run: pnpm --filter @jongminchung/web run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
