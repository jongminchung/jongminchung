name: Web

on:
  schedule:
    - cron: "17 1 * * 1"
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
      - "packages/ui/**"
      - ".node-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "knip.json"
      - "Makefile"
      - ".editorconfig"
      - "vite.config.ts"
      - "scripts/style-shell.ts"
      - "tsconfig.base.json"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Web consumer changes
        id: changes
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - '.github/workflows/web.yml'
              - 'apps/web/**'
              - 'packages/ui/**'
              - '.node-version'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'knip.json'
              - 'Makefile'
              - '.editorconfig'
              - 'vite.config.ts'
              - 'scripts/style-shell.ts'
              - 'tsconfig.base.json'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Web consumer dependencies
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changes.outputs.web == 'true'
        with:
          go-version: "1.27.0"
      - name: Check repository formatting and lint
        if: steps.changes.outputs.web == 'true'
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          make lint
      - name: Validate shadcn workspace manifests
        if: steps.changes.outputs.web == 'true'
        run: |
          pnpm exec shadcn info --json -c packages/ui
          pnpm exec shadcn info --json -c apps/web
      - name: Check unused and undeclared dependencies
        if: steps.changes.outputs.web == 'true'
        run: pnpm run deadcode
      - name: Verify shared UI package
        if: steps.changes.outputs.web == 'true'
        run: |
          pnpm --filter @jongminchung/ui run typecheck
          pnpm --filter @jongminchung/ui run test:coverage
          pnpm --filter @jongminchung/ui run build
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run typecheck
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run test:coverage
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run build
      - if: steps.changes.outputs.web == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run test:e2e
      - name: Generate scheduled content evidence report
        if: github.event_name == 'schedule'
        run: pnpm --filter @jongminchung/web run content:evidence -- --network --output content-evidence.json
      - name: Upload content evidence report
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-evidence
          path: apps/web/content-evidence.json
          if-no-files-found: error
      - name: Upload browser failure artifacts
        if: failure() && steps.changes.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-playwright-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
