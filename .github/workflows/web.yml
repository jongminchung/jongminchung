name: Web

on:
  schedule:
    - cron: "17 1 * * 1"
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/tooling/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Web consumer changes
        id: changes
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - '.github/workflows/web.yml'
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Web consumer dependencies
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
        run: pnpm --filter @jongminchung/web... install --frozen-lockfile
      - name: Validate shadcn workspace manifests
        if: steps.changes.outputs.web == 'true'
        run: |
          pnpm --filter @jongminchung/ui exec shadcn info --json
          pnpm --filter @jongminchung/web exec shadcn info --json
      - name: Verify shared UI package
        if: steps.changes.outputs.web == 'true'
        run: |
          pnpm --filter @jongminchung/ui run typecheck
          pnpm --filter @jongminchung/ui run test
          pnpm --filter @jongminchung/ui run build
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run typecheck
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run test
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run build
      - name: Report Web client asset changes
        if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run bundle:report -- --output=apps/web/bundle-report.json
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web exec playwright install --with-deps chromium
      - if: steps.changes.outputs.web == 'true'
        run: pnpm --filter @jongminchung/web run test:e2e
      - name: Generate scheduled content evidence report
        if: github.event_name == 'schedule'
        run: pnpm --filter @jongminchung/web run content:evidence -- --network --output content-evidence.json
      - name: Upload content evidence report
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: content-evidence
          path: content-evidence.json
      - name: Upload browser failure artifacts
        if: failure() && steps.changes.outputs.web == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - name: Upload Web bundle report
        if: always() && steps.changes.outputs.web == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle-report
          path: apps/web/bundle-report.json
          if-no-files-found: error
