name: Web

on:
  schedule:
    - cron: "17 1 * * 1"
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/tooling/**"
      - ".bun-version"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "knip.json"
      - "Makefile"
      - ".editorconfig"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - "scripts/style-shell.sh"
      - "tsconfig.base.json"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect Web consumer changes
        id: changes
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - '.github/workflows/web.yml'
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/tooling/**'
              - '.bun-version'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'knip.json'
              - 'Makefile'
              - '.editorconfig'
              - 'oxfmt.config.ts'
              - 'oxlint.config.ts'
              - 'scripts/style-shell.sh'
              - 'tsconfig.base.json'
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
        with:
          node-version-file: .node-version
      - name: Install Web consumer dependencies
        if: steps.changes.outputs.web == 'true' || github.event_name == 'schedule'
        run: bun install --frozen-lockfile
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.web == 'true'
        with:
          go-version: "1.27.0"
      - name: Check repository formatting and lint
        if: steps.changes.outputs.web == 'true'
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
          make lint
      - name: Validate shadcn workspace manifests
        if: steps.changes.outputs.web == 'true'
        run: |
          bunx --bun shadcn info --json -c packages/ui
          bunx --bun shadcn info --json -c apps/web
      - name: Check unused and undeclared dependencies
        if: steps.changes.outputs.web == 'true'
        run: bun run deadcode
      - name: Verify shared UI package
        if: steps.changes.outputs.web == 'true'
        run: |
          bun run --filter @jongminchung/ui typecheck
          bun run --filter @jongminchung/ui test
          bun run --filter @jongminchung/ui build
      - if: steps.changes.outputs.web == 'true'
        run: bun run --filter @jongminchung/web typecheck
      - if: steps.changes.outputs.web == 'true'
        run: bun run --filter @jongminchung/web test
      - if: steps.changes.outputs.web == 'true'
        run: bun run --filter @jongminchung/web build
      - if: steps.changes.outputs.web == 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.changes.outputs.web == 'true'
        run: bun run --filter @jongminchung/web test:e2e
      - name: Generate scheduled content evidence report
        if: github.event_name == 'schedule'
        run: bun run --filter @jongminchung/web content:evidence -- --network --output content-evidence.json
      - name: Upload content evidence report
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: content-evidence
          path: apps/web/content-evidence.json
          if-no-files-found: error
      - name: Upload browser failure artifacts
        if: failure() && steps.changes.outputs.web == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
