name: Publish Packages

on:
  workflow_dispatch:

concurrency:
  group: publish-personal-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate ui on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install package dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - run: >-
          pnpm exec vp lint
          packages/ui
      - run: pnpm --filter @jongminchung/ui run typecheck
      - run: pnpm --filter @jongminchung/ui run test:coverage
      - run: pnpm --filter @jongminchung/ui run test:node
      - run: pnpm --dir packages/ui pack --dry-run

  publish:
    name: Publish ui@1.0.0
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the exact archive before replacing the published version
        run: pnpm --dir packages/ui pack --out "${RUNNER_TEMP}/package.tgz"
      - name: Configure GitHub Packages auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_PAT"
          npm config set @jongminchung:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$GH_PAT"
      - name: Delete existing 1.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: >-
          node .github/scripts/delete-version-ids-script.ts
          "$GITHUB_REPOSITORY_OWNER" "ui" "1.0.0"
      - run: npm publish "${RUNNER_TEMP}/package.tgz" --access public --registry https://npm.pkg.github.com
      - name: Verify registry integrity and clean consumer import
        run: >-
          node .github/scripts/verify-published-package.ts
          "@jongminchung/ui" "1.0.0"
          "@jongminchung/ui/lib/utils"
      - name: Remove GitHub Packages auth
        if: ${{ always() }}
        run: |
          npm config delete @jongminchung:registry
          npm config delete //npm.pkg.github.com/:_authToken
