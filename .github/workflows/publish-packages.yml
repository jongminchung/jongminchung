name: Publish Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [tooling, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install package dependencies
        run: >-
          pnpm --filter @jongminchung/${{ matrix.package }} install
          --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @jongminchung/${{ matrix.package }} run typecheck
      - run: pnpm --filter @jongminchung/${{ matrix.package }} run test
      - run: pnpm --filter @jongminchung/${{ matrix.package }} run publish:dry-run

  publish:
    name: Publish ${{ matrix.package }}@1.0.0
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [tooling, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install package dependencies
        run: >-
          pnpm --filter @jongminchung/${{ matrix.package }} install
          --frozen-lockfile --ignore-scripts
      - name: Configure GitHub Packages auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_PAT"
          npm config set @jongminchung:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$GH_PAT"
      - name: Delete existing 1.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: >-
          .github/scripts/delete-version-ids-script.sh
          "$GITHUB_REPOSITORY_OWNER" "${{ matrix.package }}" "1.0.0"
      - run: pnpm --filter @jongminchung/${{ matrix.package }} publish --access public --no-git-checks
      - name: Remove GitHub Packages auth
        if: ${{ always() }}
        run: |
          npm config delete @jongminchung:registry
          npm config delete //npm.pkg.github.com/:_authToken
