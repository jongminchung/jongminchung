name: Publish Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify configured Node.js
        run: test "v$(cat .node-version)" = "$(node --version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Configure GitHub Packages auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_PAT"
          npm config set //npm.pkg.github.com/:_authToken "$GH_PAT"
      - name: Guard fixed package versions
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");

          for (const filePath of [
            "packages/tooling/package.json",
            "packages/ui/package.json",
          ]) {
            const packageJson = JSON.parse(readFileSync(filePath, "utf8"));

            if (packageJson.version !== "1.0.0") {
              throw new Error(`${packageJson.name} must reuse version 1.0.0`);
            }
          }
          NODE
      - run: pnpm publish --dry-run --access public
        working-directory: packages/tooling
      - run: pnpm publish --dry-run --access public
        working-directory: packages/ui
      - name: Remove existing tooling 1.0.0
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          version_ids="$(
            GH_TOKEN="$GH_PAT" gh api --paginate \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/npm/tooling/versions" \
              --jq '.[] | select(.name == "1.0.0") | .id'
          )"
          while IFS= read -r version_id; do
            test -z "$version_id" || GH_TOKEN="$GH_PAT" gh api --method DELETE \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/npm/tooling/versions/${version_id}"
          done <<< "$version_ids"
      - name: Publish tooling 1.0.0
        run: pnpm publish --access public
        working-directory: packages/tooling
      - name: Remove existing ui 1.0.0
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set +e
          version_ids="$(
            GH_TOKEN="$GH_PAT" gh api --paginate \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/npm/ui/versions" \
              --jq '.[] | select(.name == "1.0.0") | .id' 2>&1
          )"
          status=$?
          set -e
          if test "$status" -ne 0; then
            if grep -q "HTTP 404" <<< "$version_ids"; then
              version_ids=""
            else
              printf '%s\n' "$version_ids" >&2
              exit "$status"
            fi
          fi
          while IFS= read -r version_id; do
            test -z "$version_id" || GH_TOKEN="$GH_PAT" gh api --method DELETE \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/npm/ui/versions/${version_id}"
          done <<< "$version_ids"
      - name: Publish ui 1.0.0
        run: pnpm publish --access public
        working-directory: packages/ui
      - name: Remove GitHub Packages auth
        if: always()
        run: npm config delete //npm.pkg.github.com/:_authToken
