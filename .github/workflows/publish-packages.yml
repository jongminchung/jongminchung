name: Publish Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate ${{ matrix.package }} on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [tooling, ui]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install package dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: >-
          bunx oxlint --config oxlint.config.ts
          packages/${{ matrix.package }}
      - run: bun run --filter @jongminchung/${{ matrix.package }} typecheck
      - run: bun run --filter @jongminchung/${{ matrix.package }} test
      - run: bun run --filter @jongminchung/${{ matrix.package }} test:node
      - run: bun run --filter @jongminchung/${{ matrix.package }} publish:dry-run

  publish:
    name: Publish ${{ matrix.package }}@1.0.0
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tooling
            import-specifier: "@jongminchung/tooling/oxfmt"
          - package: ui
            import-specifier: "@jongminchung/ui/lib/utils"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install package dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Configure GitHub Packages auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_PAT"
          npm config set @jongminchung:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$GH_PAT"
      - name: Delete existing 1.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: >-
          .github/scripts/delete-version-ids-script.sh
          "$GITHUB_REPOSITORY_OWNER" "${{ matrix.package }}" "1.0.0"
      - run: bun publish --cwd packages/${{ matrix.package }} --access public
      - name: Verify registry integrity and clean consumer import
        run: >-
          node .github/scripts/verify-published-package.ts
          "@jongminchung/${{ matrix.package }}" "1.0.0"
          "${{ matrix.import-specifier }}"
      - name: Remove GitHub Packages auth
        if: ${{ always() }}
        run: |
          npm config delete @jongminchung:registry
          npm config delete //npm.pkg.github.com/:_authToken
