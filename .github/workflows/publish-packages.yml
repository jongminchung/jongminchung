name: Publish Packages

on:
  workflow_dispatch:

concurrency:
  group: publish-personal-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate ui on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install package dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: >-
          bunx oxlint --config oxlint.config.ts
          packages/ui
      - run: bun run --filter @jongminchung/ui typecheck
      - run: bun run --filter @jongminchung/ui test:coverage
      - run: bun run --filter @jongminchung/ui test:node
      - run: bun pm pack --cwd packages/ui --dry-run

  publish:
    name: Publish ui@1.0.0
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install package dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the exact archive before replacing the published version
        run: bun pm pack --cwd packages/ui --filename "${RUNNER_TEMP}/package.tgz"
      - name: Configure GitHub Packages auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_PAT"
          npm config set @jongminchung:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$GH_PAT"
      - name: Delete existing 1.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: >-
          bun .github/scripts/delete-version-ids-script.ts
          "$GITHUB_REPOSITORY_OWNER" "ui" "1.0.0"
      - run: npm publish "${RUNNER_TEMP}/package.tgz" --access public --registry https://npm.pkg.github.com
      - name: Verify registry integrity and clean consumer import
        run: >-
          node .github/scripts/verify-published-package.ts
          "@jongminchung/ui" "1.0.0"
          "@jongminchung/ui/lib/utils"
      - name: Remove GitHub Packages auth
        if: ${{ always() }}
        run: |
          npm config delete @jongminchung:registry
          npm config delete //npm.pkg.github.com/:_authToken
