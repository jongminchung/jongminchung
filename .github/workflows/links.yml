name: Links

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.md"
      - ".gitignore"
      - ".github/workflows/links.yml"
      - "scripts/check-links.sh"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.md"
      - ".gitignore"
      - ".github/workflows/links.yml"
      - "scripts/check-links.sh"

permissions:
  contents: read

jobs:
  verify:
    name: Local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-links.sh
