name: Links

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.md"
      - ".gitignore"
      - ".github/workflows/links.yml"
      - "scripts/check-links.ts"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.md"
      - ".gitignore"
      - ".github/workflows/links.yml"
      - "scripts/check-links.ts"

permissions:
  contents: read

jobs:
  verify:
    name: Local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun scripts/check-links.ts
