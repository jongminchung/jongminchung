name: Retire Tooling Package

on:
  workflow_dispatch:

concurrency:
  group: publish-personal-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@jongminchung"
      - name: Deprecate the retired package while preserving installed versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}
        run: >-
          npm deprecate '@jongminchung/tooling@*'
          'Retired: own oxfmt.config.ts and oxlint.config.ts in each repository and install Oxfmt/Oxlint directly.'
          --registry https://npm.pkg.github.com
      - name: Verify the published deprecation notice
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npm view '@jongminchung/tooling@*' deprecated --json --registry https://npm.pkg.github.com > "${RUNNER_TEMP}/tooling-deprecation.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/tooling-deprecation.json`, 'utf8'));
          const notices = Array.isArray(result) ? result : [result];
          assert.ok(notices.length > 0);
          for (const notice of notices) assert.equal(notice, 'Retired: own oxfmt.config.ts and oxlint.config.ts in each repository and install Oxfmt/Oxlint directly.');
          console.log(`Verified deprecation for ${notices.length} published version(s).`);
          JS
