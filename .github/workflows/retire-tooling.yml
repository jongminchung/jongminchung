name: Retire Tooling Package

on:
  workflow_dispatch:
    inputs:
      delete:
        description: Delete the retired tooling package after archiving version 1.0.0
        type: boolean
        default: false
        required: true

concurrency:
  group: publish-personal-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: "@jongminchung"
      - name: Archive the published version before retirement
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p "${RUNNER_TEMP}/tooling-archive"
          npm view '@jongminchung/tooling@1.0.0' --json --registry https://npm.pkg.github.com > "${RUNNER_TEMP}/tooling-archive/metadata.json"
          npm pack '@jongminchung/tooling@1.0.0' --ignore-scripts --pack-destination "${RUNNER_TEMP}/tooling-archive" --registry https://npm.pkg.github.com
          cd "${RUNNER_TEMP}/tooling-archive"
          sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retired-tooling-1.0.0
          path: ${{ runner.temp }}/tooling-archive/
          retention-days: 90
          if-no-files-found: error
      - name: Delete the explicitly selected retired package
        if: ${{ inputs.delete }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh api --method DELETE /users/jongminchung/packages/npm/tooling
      - name: Verify the package is absent
        if: ${{ inputs.delete }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          remaining=$(gh api --paginate '/users/jongminchung/packages?package_type=npm' --jq '.[] | select(.name == "tooling") | .id')
          test -z "$remaining"
