packages:
  - "apps/*"
  - "packages/*"

hoistPattern:
  - "*"

overrides:
  "@electron/rebuild": "4.2.0"
  "extract-zip": "npm:@electron-internal/extract-zip@1.0.4"

allowBuilds:
  "@vscode/ripgrep": true
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
  nx: true
  sharp: true
  spawn-sync: true

catalog:
  "@axe-core/playwright": "4.12.1"
  "@base-ui/react": "1.6.0"
  "@codemirror/commands": "6.10.4"
  "@codemirror/lang-css": "6.3.1"
  "@codemirror/lang-html": "6.4.11"
  "@codemirror/lang-java": "6.0.2"
  "@codemirror/lang-javascript": "6.2.5"
  "@codemirror/lang-json": "6.0.2"
  "@codemirror/lang-python": "6.2.1"
  "@codemirror/language": "6.12.4"
  "@codemirror/merge": "6.12.2"
  "@codemirror/search": "6.7.1"
  "@codemirror/state": "6.7.1"
  "@codemirror/view": "6.43.6"
  "@playwright/test": "1.61.1"
  "@nx/devkit": "23.1.0"
  "@nx/js": "23.1.0"
  "@tailwindcss/postcss": "4.3.3"
  "@tanstack/react-virtual": "3.14.7"
  "@types/node": "26.1.1"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  "@vitejs/plugin-react": "6.0.3"
  "@xterm/addon-fit": "0.11.0"
  "@xterm/xterm": "6.0.0"
  "class-variance-authority": "0.7.1"
  "clsx": "2.1.1"
  "cmdk": "1.1.1"
  "lucide-react": "1.25.0"
  "oxfmt": "0.59.0"
  "oxlint": "1.74.0"
  "oxlint-tsgolint": "0.25.0"
  "postcss": "8.5.20"
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "shadcn": "4.16.0"
  "nx": "23.1.0"
  "sharp": "0.35.3"
  "tailwindcss": "4.3.3"
  "tailwind-merge": "3.6.0"
  "tsdown": "0.22.12"
  "typescript": "7.0.2"
  "tw-animate-css": "1.4.0"
  "vitest": "4.1.10"
  "vite": "8.1.5"

minimumReleaseAgeExclude:
  - "@base-ui/react@1.6.0"
  - postcss@8.5.19
  - "@tanstack/react-virtual@3.14.7"
  - "@tanstack/virtual-core@3.17.5"
  - tsdown@0.22.12
  - verkit@0.1.0

onlyBuiltDependencies:
  - "@vscode/ripgrep"
  - "electron"
  - "esbuild"
  - "fs-xattr"
  - "macos-alias"
  - "node-pty"
  - "nx"
  - "sharp"
  - "spawn-sync"
