packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@axe-core/playwright": 4.14.0
  "@base-ui/react": 1.9.0
  "@excalidraw/excalidraw": 0.18.1
  "@fumadocs/tailwind": 0.1.4
  "@playwright/test": 1.64.1
  "@tailwindcss/postcss": 4.3.3
  "@types/mdast": 4.0.4
  "@types/mdx": 2.0.14
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-v8": 5.0.5
  "babel-plugin-react-compiler": 1.0.0
  "class-variance-authority": 0.7.1
  "clsx": 2.1.1
  "cmdk": 1.1.1
  "esbuild": 0.28.2
  "fumadocs-core": 16.17.8
  "fumadocs-mdx": 15.4.10
  "fumadocs-ui": 16.17.8
  "happy-dom": ^21.0.4
  "knip": 6.43.0
  "lucide-react": 1.61.0
  "mdast-util-mdx-jsx": 3.2.0
  "next": 16.4.3
  "next-intl": 4.14.9
  "next-themes": 0.4.6
  "postcss": 8.5.31
  "react": 19.3.1
  "react-dom": 19.3.1
  "server-only": 0.0.1
  "shadcn": 4.22.1
  "tailwindcss": 4.3.3
  "tailwind-merge": 3.7.0
  "tsx": 4.23.15
  "tw-animate-css": 1.4.0
  "typescript": 7.0.2
  "unist-util-visit": 5.2.0
  "vite-plus": 1.4.0
  "zod": 4.6.7

catalogs:
  ui-peer:
    react: ^19.3.0
    react-dom: ^19.3.0
    tailwindcss: ^4.3.3

overrides:
  # Vite+와 내장 Vitest의 버전에 맞춰 함께 갱신한다.
  "vite@*": "npm:@voidzero-dev/vite-plus-core@1.4.0"
  "vitest@*": 5.0.5
  # Excalidraw pins Radix Tabs 1.0.2, whose peer range excludes React 19.
  "@radix-ui/react-tabs": 1.2.1
  fast-uri: 3.1.9
  lodash-es: 4.18.1
  nanoid: 5.1.16
  sharp: 0.35.5
  # MDX serializer와 호환되는 최신 릴리스를 사용한다.
  mdast-util-to-markdown: 2.2.1

peerDependencyRules:
  # Vite+는 Vite 8을 포함하지만 alias 패키지 버전으로 표시된다.
  allowedVersions:
    "@vitest/mocker>vite": 1.4.0
    "vitest>vite": 1.4.0
    "fumadocs-mdx>vite": 1.4.0

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - mdast-util-to-markdown@2.2.1
