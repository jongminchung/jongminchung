[test]
preload = ["./scripts/register-content-plugin.ts"]
pathIgnorePatterns = [
  "**/.next/**",
  "**/.output/**",
  "**/.tmp-*/**",
  "**/.wxt/**",
  "**/tests/live/**",
  "**/*.e2e.test.*",
]
# 개별 테스트에는 커버리지를 강제하지 않음. 전체 검증은 test:coverage에서 실행함.
coverage = false
coverageReporter = ["text", "lcov"]
coverageDir = "../../coverage/web"
coverageSkipTestFiles = true
# Bun enforces thresholds for every loaded file, so this is the minimum file-level floor
coverageThreshold = { lines = 0.2, functions = 0 }
coveragePathIgnorePatterns = [
  ".source/**",
  "app/**",
  "components/**",
  "content/**",
  "scripts/**",
  "source.config.ts",
  "mdx-components.tsx",
  "proxy.ts",
  "../../packages/**",
  "lib/content-repository.ts",
  "lib/fumadocs-source.ts",
  "lib/tech/search-server.ts",
  "**/*.d.ts",
  "**/generated/**",
  "**/fixtures/**",
  "**/__fixtures__/**",
]
